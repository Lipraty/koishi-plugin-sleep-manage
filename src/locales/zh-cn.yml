commands:
  sleep:
    description: 管理你的睡眠喵
    options:
      timezone: 设置你的时区（+8、-5、LOCAL 或 UTC）
      sleep: 设置就寝时间（HH:mm）
      auto: 切换每天第一条消息自动早安
      gagme: 切换个人禁言（旧版 gagme）
      rank: 查看本群今日早起/早睡排行
      week: 查看本周睡眠报告
      month: 查看本月睡眠报告
      year: 查看今年睡眠报告

sleep:
  timezone:
    done: 已把时区设置为 {0}。
    invalid: 时区格式不正确，请使用 +8、-5、LOCAL 或 UTC。
    current: 你当前的时区是 {0}。
  sleep:
    ok: 已把就寝时间设置为 {0}。
    invalid: 时间格式不正确，请使用 HH:mm，例如 23:00。
    current: 你当前的就寝时间是 {0}。
    none: 未设置
  auto:
    on: 已开启：每天的第一条消息会自动视为早安。
    off: 已关闭：每天的第一条消息不会自动视为早安。
  gagme:
    on: 已开启个人禁言：之后说晚安会被塞口球。
    off: 已关闭个人禁言。
  rank:
    guildOnly: 本命令只能在群聊中使用。

  morning:
    frist: |-
      <random>
        <>早安！第一次记录，以后也要一起数羊喵~</>
        <>早安早安！这是第一次记录哦~</>
      </random>
    timer: 你的睡眠时长为 {0} 时 {1} 分 {2} 秒
    rank: 你是本群今天第 {0} 个起床的哦
    reply: |-
      <random>
        <>早！你的小可爱已经等候多时啦！</>
        <>早早早！</>
        <>早安早安~</>
        <>唔... 这么快就早上了</>
        <>好早...好想再睡会....zzZZ</>
        <>新的一天也要元气满满！</>
      </random>
    outOfRange: |-
      <random>
        <>说晚安了就别玩手机啦！</>
        <>不是已经睡了吗，怎么还在说话！</>
        <>再玩手机就要没收了哦！</>
        <>闭眼！睡觉！</>
      </random>

  evening:
    frist: |-
      <random>
        <>晚安！第一次记录，今晚也要做个好梦喵~</>
        <>晚安晚安！第一次记录完成~</>
      </random>
    timer: 你的清醒时长为 {0} 时 {1} 分 {2} 秒
    rank: 你是本群今天第 {0} 个入睡的哦
    reply: |-
      <random>
        <>你怎么还没睡！</>
        <>再不睡觉我就要生气了哦！</>
        <>你怎么还没睡......我都要睡着了</>
        <>呜哇！再不睡觉小心你的头发！哼！</>
        <>晚安๑乛◡乛๑</>
        <>哦呀斯密ヾ(=･ω･=)o</>
      </random>
    count: |-
      <random>
        <>这是你第 {0} 次说晚安了！</>
        <>你怎么还没睡......我都要睡着了zzZZ</>
        <>这是第 {0} 次了吧！！</>
        <>╰（‵□′）╯{0} 次晚安了！！！！</>
      </random>
    outOfRange: |-
      <random>
        <>说晚安了就别玩手机啦！</>
        <>说好要睡觉的人怎么还在说话！</>
        <>已经很晚啦，快去睡觉吧！</>
      </random>

  evening-gag:
    frist: |-
      <random>
        <>晚安！第一次记录，口球已经准备好了喵~</>
      </random>
    timer: 你的清醒时长为 {0} 时 {1} 分 {2} 秒
    rank: 你是本群今天第 {0} 个入睡的哦
    reply: |-
      <random>
        <>晚安喵~（禁言口球已送达）</>
        <>睡吧睡吧，醒来再说话~（口球已安排）</>
      </random>

  bedtimeReminder: |-
    <random>
      <>已经很晚啦，快去睡觉吧</>
      <>到点啦，该睡觉了哦</>
      <>别玩啦，快去睡觉！</>
    </random>

  report:
    week: |-
      本周睡眠报告
      记录 {0} 条，覆盖 {1} 天
      平均时长 {2} 时 {3} 分
      平均入睡 {4}
      平均醒来 {5}
    month: |-
      本月睡眠报告
      记录 {0} 条，覆盖 {1} 天
      平均时长 {2} 时 {3} 分
      平均入睡 {4}
      平均醒来 {5}
    year: |-
      今年睡眠报告
      记录 {0} 条，覆盖 {1} 天
      平均时长 {2} 时 {3} 分
      平均入睡 {4}
      平均醒来 {5}
    empty: 还没有已完成的睡眠记录
